<section class="py-5">
    <div class="py-5">
        <div class="pt-5">
            <h1 class="text-center fw-bolder fs-1 text-warning"><span class="position-relative ">Trendify</span></h1>
            <p class="text-muted text-center pt-2 fs-tiny">Best selling products</p>
        </div>
    </div>
    <div class="container">
        <div class="row align-items-stretch mx-auto">
            @for (movie of MoviesListt; track $index) {

            <div class="col-12 col-md-4 col-lg-3 p-2">
                <div class="w-100 h-100 border border-1 border-dark border-opacity-25 rounded-4 p-3 bg-dang">
                    <div class="w-100">
                        <img [src]='"https://image.tmdb.org/t/p/w500"+movie.poster_path'
                            class="w-100 h-100 rounded-4 object-fit-cover" alt="...">
                      
                    </div>
                    <div class=" pt-4 pb-2">
                        <h5 class="card-title">
                            <span class="text-danger-emphasis fw-semibold" *ngIf="movie.title">Title : </span>
                            <span class="text-danger-emphasis fw-semibold" *ngIf="movie.name">Name : </span>
                            <span class="movie-title">{{movie.title || movie.name}}</span>
                        </h5>
                        <p class="my-1">
                            <span class="text-danger-emphasis fw-semibold">Release Date :</span>
                            {{movie.release_date}}
                        </p>
                        <p class="card-text">
                            <span class="text-danger-emphasis fw-semibold">Overview :</span>
                            {{movie.overview}}
                        </p>
                    </div>

                </div>
            </div>
            }
        </div>

    </div>
</section>
