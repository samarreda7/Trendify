<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <div class="contact-form-wrapper">
                    <h2 class="contact-title ">Contact me</h2>
                    <p class="contact-subtitle text-muted mb-4">
                        Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor
                    </p>

                    <div >
                        <div class="row mb-3">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="firstName" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="firstName" />
                            </div>
                            <div class="col-md-6">
                                <label for="lastName" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="lastName" />
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" />
                            </div>
                            <div class="col-md-6">
                                <label for="phone" class="form-label">Phone</label>
                                <input type="tel" class="form-control" id="phone" />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="topic" class="form-label">Choose a Topic</label>
                            <select class="form-select" id="topic">
                                <option selected>Select one...</option>
                                <option value="1">General Inquiry</option>
                                <option value="2">Technical Support</option>
                                <option value="3">Business Partnership</option>
                                <option value="4">Feedback</option>
                                <option value="5">Other</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="message" class="form-label">Message</label>
                            <textarea class="form-control" id="message" rows="6"
                                placeholder="Type message..."></textarea>
                        </div>

                        <div>
                            <button type="submit" class="btn btn-submit px-5 py-2">Submit</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
