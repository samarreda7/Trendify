<section class="notfound-section">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-12 col-lg-8 text-center">
        <!-- 404 Number -->
        <div class="error-number mb-4">
          <span class="four">4</span>
          <span class="zero">
            <div class="sad-face">
              <div class="eyes">
                <span class="eye-left">•</span>
                <span class="eye-right">•</span>
              </div>
              <div class="mouth"></div>
            </div>
          </span>
          <span class="four">4</span>
        </div>

        <!-- Message -->
        <h1 class="notfound-title mb-3">Oops! Page Not Found</h1>
        <p class="notfound-text mb-4">
          The page you are looking for might have been removed, had its name changed, 
          or is temporarily unavailable.
        </p>

        <div class="floating-elements mb-5">
          <span class="star star-1">⭐</span>
          <span class="star star-2">✨</span>
          <span class="star star-3">🌟</span>
          <span class="star star-4">💫</span>
        </div>

        <div class="button-group">
          <a href="/" class="btn btn-primary-yellow px-4 py-3 me-3">
            <i class="bi bi-house-door-fill me-2"></i>
            Go Home
          </a>
          <a href="javascript:history.back()" class="btn btn-outline-yellow px-4 py-3">
            <i class="bi bi-arrow-left me-2"></i>
            Go Back
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="bg-decoration">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
  </div>
</section>
