<div class="col-12 col-md-4 col-lg-3 p-2">
    <div class="w-100 h-100 border border-1 border-dark border-opacity-25 rounded-4 p-3">
        <div class="img-container w-100">
            <ng-content select="#productImg"></ng-content>

        </div>
        <div class=" pt-4 pb-2">
            <h6 class="">
                <span class=" fw-semibold text-danger-emphasis">Product Name : </span>
                <ng-content class="movie-title" select="#name"></ng-content>
            </h6>

            <p class="card-text">
                <span class=" fw-semibold text-danger-emphasis">description : </span>
                <ng-content select="#description"></ng-content>

            </p>
            <p class="my-1">
                <span class="text-danger-emphasis fw-semibold">Category :</span>
                <ng-content select="#category"></ng-content>

            </p>
            <p class="my-1">
                <span class="text-danger-emphasis fw-semibold">Price :</span>
                <ng-content select="#price"></ng-content> $

            </p>
        </div>
        <div class="d-flex justify-content-center">
            <button class="btn btn-outline-warning"><i class="fa-solid fa-cart-shopping"></i> Add to Cart</button>
        </div>
    </div>
</div>
